<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ff8fab, #f9a8d4);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      animation: fadeIn 0.4s ease;
    }

    img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 18px;
    }

    h2 {
      margin: 0 0 16px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      min-width: 90px;
      touch-action: manipulation;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #e5e5e5;
      position: fixed;
      left: 50%;
      transform: translateX(110px);
      z-index: 10;
    }

    /* Letter styling */
    #letter {
      display: none;
      background: linear-gradient(#fffdf7, #fff7e6);
      font-family: "Georgia", "Times New Roman", serif;
      position: relative;
      padding: 32px 28px;
      max-width: 420px;
      border-radius: 12px;
      box-shadow:
        0 12px 30px rgba(0,0,0,0.15),
        inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    #letter::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,0,0,0.015),
          rgba(0,0,0,0.015) 1px,
          transparent 1px,
          transparent 4px
        );
      border-radius: 12px;
      pointer-events: none;
    }

    #letter::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #f0e6d8 50%, transparent 50%);
      border-top-right-radius: 12px;
    }

    .letter-content {
      position: relative;
      line-height: 1.7;
    }

    .letter-content h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .letter-content p {
      margin: 16px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <audio id="song" loop>
    <source src="darling.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="question">
    <img src="photo_valentine.jpeg" alt="Nosotros" />
    <h2>¿Serías mi Valentine’s una vez más?</h2>

    <div class="buttons">
      <button id="yes">Sí</button>
      <button id="no">No</button>
    </div>
  </div>

  <div class="card" id="letter">
    <div class="letter-content">
      <h2>Plan de Valentine’s</h2>

      <p>
        <strong>Fecha:</strong> 13 de Febrero<br>
        <strong>Hora:</strong> 10:00 PM
      </p>

      <p>
        <strong>Plan:</strong><br>
        Una salidita a la playa.
      </p>

      <p>
        Emocionado de pasar un finde juntitos.<br><br>
        Con amor,<br>
        Edson
      </p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const question = document.getElementById("question");
    const letter = document.getElementById("letter");
    const song = document.getElementById("song");

    function moveNo() {
      const padding = 20;
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.transform = "none";
    }

    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("touchstart", moveNo);
    noBtn.addEventListener("click", moveNo);

    yesBtn.addEventListener("click", () => {
      question.style.display = "none";
      letter.style.display = "block";
      song.play();
    });
  </script>

</body>
</html>
