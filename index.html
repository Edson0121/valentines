<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ff8fab, #f9a8d4);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      animation: fadeIn 0.4s ease;
    }

    img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 18px;
    }

    h2 {
      margin: 0 0 16px;
    }

    .buttons {
      position: relative;
      height: 60px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      min-width: 90px;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #e5e5e5;
      position: absolute;
    }

    /* Letter styling */
    #letter {
      display: none;
      background: #fffaf0;
      font-family: "Georgia", serif;
      position: relative;
    }

    #letter::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.03),
        transparent 30%
      );
      pointer-events: none;
      border-radius: 20px;
    }

    .letter-content {
      position: relative;
      line-height: 1.6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <audio id="song" loop>
    <source src="darling.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="question">
    <img src="photo_valentine.jpeg" alt="Nosotros" />
    <h2>¿Serías mi Valentine’s una vez más?</h2>

    <div class="buttons">
      <button id="yes">Sí</button>
      <button id="no">No</button>
    </div>
  </div>

  <div class="card" id="letter">
    <div class="letter-content">
      <h2>Plan de Valentine’s</h2>

      <p><strong>Fecha:</strong> 13 de Febrero<br>
      <strong>Hora:</strong> 10:00 PM</p>

      <p><strong>Plan:</strong><br>
      Una salidita a la playa.</p>

      <p>
        Emocionado de pasar un finde juntitos.<br>
        Con amor,<br>
        Edson
      </p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const question = document.getElementById("question");
    const letter = document.getElementById("letter");
    const song = document.getElementById("song");

    function moveNo() {
      const parent = noBtn.parentElement;
      const x = Math.random() * (parent.offsetWidth - noBtn.offsetWidth);
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `0px`;
    }

    noBtn.addEventListener("touchstart", moveNo);
    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("click", moveNo);

    yesBtn.addEventListener("click", () => {
      question.style.display = "none";
      letter.style.display = "block";
      song.play();
    });
  </script>

</body>
</html>
