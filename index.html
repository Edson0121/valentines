<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ff8fab, #f9a8d4);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      animation: fadeIn 0.4s ease;
      text-align: center;
    }

    img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 18px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      min-width: 90px;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #e5e5e5;
      position: fixed;
      left: 50%;
      transform: translateX(110px);
      z-index: 10;
    }

    /* ---------- ENVELOPE ---------- */

    #envelope-wrapper {
      display: none;
      width: 100%;
      min-height: 100svh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px 16px;
      box-sizing: border-box;
      perspective: 1000px;
    }

    #envelope-wrapper.show {
      display: flex;
    }

    .envelope {
      width: min(90vw, 360px);
      aspect-ratio: 16 / 10;
      height: auto;
      position: relative;
      background: #f5f5f5;
      border-radius: 6px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      cursor: pointer;
      overflow: hidden;
    }

    .envelope .back {
      position: absolute;
      inset: 0;
      background: #f5f5f5;
      border-radius: 6px;
      z-index: 1;
    }

    .envelope .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #eee 50%, transparent 50%);
      transform-origin: top;
      transform: rotateX(0deg);
      transition: transform 0.8s ease;
      border-radius: 6px;
      z-index: 3;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
    }

    /* ---------- LETTER ---------- */

    .letter {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 8%;
      background: linear-gradient(#fffdf7, #fff7e6);
      font-family: Georgia, serif;
      padding: 24px;
      border-radius: 8px;
      box-shadow:
        0 12px 30px rgba(0,0,0,0.15),
        inset 0 0 0 1px rgba(0,0,0,0.05);
      transform: translateY(120%);
      opacity: 0;
      transition: transform 0.8s ease, opacity 0.4s ease;
      z-index: 2;
    }

    .envelope.open .letter {
      transform: translateY(-52%);
      opacity: 1;
    }

    .envelope.open {
      overflow: visible;
    }

    #envelope-wrapper.letter-stage {
      perspective: none;
    }

    #envelope-wrapper.letter-stage .envelope {
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }

    .letter.letter-centered {
      position: relative;
      left: auto;
      right: auto;
      bottom: auto;
      max-width: min(90vw, 420px);
      margin: 0 auto;
      opacity: 1;
      transform: translateY(0);
      animation: letterRise 0.7s ease forwards;
      z-index: 5;
    }

    @keyframes letterRise {
      0% { transform: translateY(-30%); }
      100% { transform: translateY(0); }
    }

    .letter::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #f0e6d8 50%, transparent 50%);
      border-top-right-radius: 8px;
    }

    .letter h2 {
      margin-top: 0;
    }

    .letter p {
      line-height: 1.7;
      margin: 16px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<audio id="song" loop>
  <source src="darling.mp3" type="audio/mpeg">
</audio>

<!-- QUESTION -->
<div class="card" id="question">
  <img src="photo_valentine.jpeg" alt="Nosotros" />
  <h2>¿Serías mi Valentine’s una vez más?</h2>
  <div class="buttons">
    <button id="yes">Sí</button>
    <button id="no">No</button>
  </div>
</div>

<!-- ENVELOPE -->
<div id="envelope-wrapper">
  <div class="envelope" id="envelope">
    <div class="back"></div>
    <div class="letter" id="letter">
      <h2>Plan de Valentine’s</h2>

      <p>
        <strong>Fecha:</strong> 13 de Febrero<br>
        <strong>Hora:</strong> 10:00 PM
      </p>

      <p>
        <strong>Plan:</strong><br>
        Una salidita a la playa.
      </p>

      <p>
        Emocionado de pasar un finde juntitos.<br><br>
        Con amor,<br>
        Edson
      </p>
    </div>
    <div class="flap"></div>
  </div>
</div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const question = document.getElementById("question");
  const envelopeWrapper = document.getElementById("envelope-wrapper");
  const envelope = document.getElementById("envelope");
  const letter = document.getElementById("letter");
  const song = document.getElementById("song");

  function moveNo() {
    const padding = 20;
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding);
    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
    noBtn.style.transform = "none";
  }

  noBtn.addEventListener("mouseenter", moveNo);
  noBtn.addEventListener("touchstart", moveNo);
  noBtn.addEventListener("click", moveNo);

  yesBtn.addEventListener("click", () => {
    question.style.display = "none";
    envelopeWrapper.classList.add("show");
    song.play();
  });

  envelope.addEventListener("click", () => {
    envelope.classList.add("open");
    setTimeout(() => {
      envelopeWrapper.classList.add("letter-stage");
      envelopeWrapper.appendChild(letter);
      letter.classList.add("letter-centered");
    }, 900);
  });
</script>

</body>
</html>
